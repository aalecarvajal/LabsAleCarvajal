<!DOCTYPE html>
<html lang="es"> 

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mi Blog | Contact Us</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet"/>
</head>

<body class="d-flex flex-column min-vh-100">
  
    <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-md bg-lavanda">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">Mi Blog</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menu" aria-controls="menu"
              aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-center" id="menu">
        <ul class="navbar-nav gap-2">
            <li class="nav-item"><a class="nav-link px-3" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link px-3" href="about.html">About Us</a></li>
            <li class="nav-item"><a class="nav-link active px-3" aria-current="page" href="contact.html">Contact Us</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== GRID: AD | CONTENT | NEWS ===== -->
  <div class="container-fluid flex-grow-1">
    <div class="row">

      <aside class="col-md-2 bg-menta zona-reservada border-end">
        <p class="text-secondary text-center small mt-3">Espacio publicitario</p>
      </aside>

    <main class="col-md-8 py-4">
        <h1 class="display-5 fw-bold text-center">Contáctame</h1>
        <p class="lead text-center text-secondary">
            ¿Sabes de un concierto que debería reseñar? ¿Tienes una sugerencia? ¡Escríbeme!
        </p>

        <div class="row justify-content-center">
            <div class="col-lg-8">

            <!-- Aquí aparecerá la alerta -->
            <div id="alertPlaceholder"></div>

            <form id="formContacto" class="card card-body shadow-sm">
                <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email"
                        placeholder="nombre@ejemplo.com" required>
                </div>
                <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea class="form-control" id="mensaje" rows="5"
                            placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>
                <button type="submit" class="btn btn-lila align-self-start">Enviar</button>
            </form>

            </div>
        </div>
    </main>

      <aside class="col-md-2 bg-menta zona-reservada border-start">
        <p class="text-secondary text-center small mt-3">Noticias (próximamente)</p>
      </aside>

    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="bg-lavanda text-center py-3">
    <p class="mb-1 fw-semibold">Equipo: Ale Carvajal</p>
    <p class="mb-0 small text-secondary">
      ale@blogfalso.com 
    </p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
