<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AD-11 - Uso de Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

</head>
<body>
    <div class="container-fluid"> <!--fluid: ocupa todo el ancho de la pantalla-->
      <button type="button" class="btn-outline theme-primary">Primary</button>  
      <button type="button" class="btn-outline theme-accent">Accent</button>
      <button type="button" class="btn-outline theme-success">Success</button>
      
      <p class="text-start">Izquierda</p>
      <p class="text-center fg-danger">Centro</p>
      <p class="text-end">Derecha</p>

        <div class="card" style="width: 18rem;">
            <div class="card-header">
                Hoja de Ruta
            </div>
            <img src="https://thumbs.dreamstime.com/b/abundancia-de-cesta-de-fruta-tropical-una-canasta-de-mimbre-rebosante-de-frutas-tropicales-maduras-como-el-mango-de-pi%C3%B1a-y-m%C3%A1s-368085730.jpg" class="card-img-top" alt="Cesta de frutas tropicales">
            <div class="card-body">
                <h4 class="card-title">Frutas</h4>
                <p class="card-text">Aquí tenemos una cesta de frutas tropicales</p>
            </div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item">Piña</li>
                <li class="list-group-item">Mango</li>
                <li class="list-group-item">Papaya</li>
            </ul>

        </div>

    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</body>
</html>
